<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123d2a"><title>ゴルフ攻略メモ</title>
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;} body{min-width:0;overflow-wrap:break-word} button,select,input{font:inherit;touch-action:manipulation} button{-webkit-appearance:none;appearance:none;cursor:pointer} main{width:100%;min-width:0} .card{min-width:0} .holes,.summary,.clubgrid{min-width:0}
:root{--g:#123d2a;--g2:#246b4a;--bg:#f5f4ed;--ink:#17231d;--muted:#657168;--line:#dbe2dc;--gold:#f1c75b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}header{background:var(--g);color:#fff;padding:18px 16px;border-radius:0 0 20px 20px}h1{font-size:20px;margin:0 0 5px}.sub{font-size:12px;line-height:1.5;opacity:.9}main{max-width:760px;margin:auto;padding:7px}.card{background:white;border-radius:12px;padding:10px;margin-bottom:8px;box-shadow:0 2px 10px #0000000a}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#f2f6f1;padding:10px;border-radius:11px}.stat small{font-size:11px;color:var(--muted);display:block}.stat strong{font-size:19px}.holes{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:6px 0}.hole{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 0 4px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}.hole small{font-size:10px;font-weight:700;line-height:1.1}.addshot{border:1px dashed var(--g2);background:#edf5ef;color:var(--g);border-radius:9px;padding:10px;font-weight:800;width:100%;margin-top:8px}.hole.active{background:var(--g2);color:#fff}.hole.logged{box-shadow:inset 0 -4px var(--gold)}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.top h2{font-size:20px;margin:0}.pill{background:#e6f0e9;color:var(--g);padding:5px 9px;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap}.yard{font-size:12px;color:var(--muted);margin:5px 0 12px}.lead{background:#edf5ef;border-left:4px solid var(--g2);padding:11px;border-radius:8px;font-size:13px;line-height:1.6}.section{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin:13px 0 7px}.planrow{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #edf0ec}.planrow:last-child{border-bottom:0}.num{width:27px;height:27px;background:var(--g);color:white;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px}.planrow b{font-size:13px}.planrow p{margin:3px 0 0;color:#526057;font-size:12px;line-height:1.5}.record{background:#f7f8f5;border:1px solid #e4e9e3;padding:11px;border-radius:12px;margin-top:9px}.recordhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.recordhead b{font-size:13px}.tag{font-size:11px;background:#e7ece7;border-radius:20px;padding:4px 7px;color:#46554a}.clubs{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.club{border:1px solid #d5ddd6;background:white;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:750;color:var(--ink)}.club.selected{background:var(--g2);border-color:var(--g2);color:white}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field select,.field input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:white;font-size:14px}.btnrow{display:flex;gap:8px;margin-top:11px}.btn{flex:1;border:0;border-radius:10px;padding:12px 9px;font-weight:800;background:var(--g);color:white;font-size:13px}.btn.alt{background:#e5ebe6;color:var(--g)}.btn.warn{background:#f4e8e5;color:#8d3930}.clubgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.dist{background:#f2f5f1;border-radius:9px;padding:9px 4px;text-align:center}.dist b{display:block;font-size:13px}.dist span{font-size:11px;color:var(--muted)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid #e6ebe6;padding:8px 6px;text-align:left;white-space:nowrap}th{color:var(--muted)}.note{font-size:11px;line-height:1.6;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:11px;padding:16px}

@media (max-width:600px){
  main{padding:8px 10px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .card{padding:10px;margin-bottom:10px;border-radius:12px}
  .holes{grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
  .hole{min-height:49px;padding:6px 1px;font-size:14px}
  .hole small{font-size:10px;white-space:normal;text-align:center;line-height:1.15}
  .top h2{font-size:19px}
  .planrow{grid-template-columns:27px minmax(0,1fr);gap:7px}
  .planrow p{font-size:13px;line-height:1.55;overflow-wrap:anywhere}
  .record{padding:9px;margin-top:8px}
  .clubs{gap:6px}
  .club{min-height:40px;padding:9px 10px;font-size:13px}
  .addshot,.btn{min-height:44px;font-size:13px}
  .btnrow{gap:6px}
  .yard{font-size:13px}
  .lead{font-size:13px;overflow-wrap:anywhere}
  .tablewrap{max-width:100%;-webkit-overflow-scrolling:touch}
  table{font-size:12px}
}
@media (max-width:360px){
  .two{grid-template-columns:1fr}
  .btnrow{flex-direction:column}
  .summary{grid-template-columns:1fr 1fr}
}
</style></head><body>
<main>
<p class="note">クラブ記録はこの端末のブラウザ内に保存します。保存が使えないプレビュー環境では、ページを閉じると記録が消える場合があります。</p>
<div class="card"><div class="section">ホールを選ぶ（黄色ライン＝記録あり）</div><div class="holes" id="holes"></div><div class="top"><h2 id="title">1番ホール</h2><span class="pill" id="par">Par 4</span></div><div class="yard" id="yard"></div><div class="lead" id="lead"></div><div class="section">おすすめ攻略プラン</div><div id="plan"></div><div class="section">実際に使ったクラブを記録</div><div id="records"></div><div class="btnrow"><button class="btn alt" id="prev">← 前のホール</button><button class="btn" id="next">次のホール →</button></div></div>
<div class="card"><div class="section">記録一覧</div><div class="tablewrap"><table id="review"></table></div><div class="btnrow"><button class="btn alt" id="export">記録をコピー</button><button class="btn warn" id="reset">記録をリセット</button></div><p class="note" id="feedback">各ホールのクラブ記録を入れると、ここに振り返りが出ます。</p></div>
<p class="note">※戦略は共有された飛距離とヤーデージに基づく暫定案。ハザード位置、当日のティー位置、風、ピン位置は反映していません。現地のコース図と安全な狙い所を優先してください。</p>
</main><footer>クラブ選択数からスコアを自動計算</footer>
<script>
const holes=[
[369,4,"ティーショットは方向優先。2打目で無理にグリーンを狙わず、3打目を打ちやすい場所へ。",["ドライバー","4U","48°"]],
[343,4,"短めのパー4。安全に運び、2打目は残り距離とライを見て判断。",["ドライバー","5U","PW"]],
[116,3,"ピンではなくグリーン中央を狙い、左右のミスを減らす。",["9I","PW"]],
[408,4,"長いパー4。2オンにこだわらず、3打目を得意距離から打つ。",["ドライバー","4U","48°"]],
[170,3,"距離のあるパー3。ピンを狙いすぎず、グリーンの広い側を狙う。",["4U","56°"]],
[495,5,"パー5は3打目勝負。無理な2オンを狙わず、安全に前進。",["ドライバー","4U","5U","PW"]],
[360,4,"方向重視。残り距離を見て無理せず、寄せやすい場所へ。",["ドライバー","5U","PW"]],
[526,5,"長いパー5。飛距離を欲張らず、1打ごとに安全な場所へ。",["ドライバー","4U","5U","PW"]],
[349,4,"前半最後。欲張らず、ティーショットを安全な位置に置く。",["ドライバー","5U","PW"]],
[340,4,"後半も安全第一。リズムを整え、無理な攻めはしない。",["ドライバー","5U","PW"]],
[432,5,"3打目を得意距離に合わせる。安全に刻んでチャンスを作る。",["ドライバー","4U","52°","PW"]],
[266,4,"短いパー4。ドライバーで近くまで運べる可能性。ハザード確認は必須。",["ドライバー","5U","48°","52°"]],
[316,4,"ティーショット後は残り約128y。得意なアイアンでセンター狙い。",["ドライバー","8I","PW"]],
[140,3,"140yのショート。力まず、グリーン中央を狙う。",["6U","7I","PW"]],
[301,4,"短めのパー4。ティーショットを安全に置けばチャンス。",["ドライバー","PW","9I"]],
[411,5,"パー5は3打目勝負。2打目で無理せず、残り60〜80yを作る。",["ドライバー","4U","52°","PW"]],
[179,3,"長めのパー3。ピンを直接狙わず、グリーンの広い側へ。",["4U","56°"]],
[344,4,"最終ホール。スコアを意識して振り回さず、いつものテンポで。",["ドライバー","5U","PW"]]
];
const distances=[["ドライバー",188],["4U",160],["5U",145],["6U",135],["7I",130],["8I",124],["9I",116],["PW",100],["48°",80],["52°",65],["56°",55]];
const names=[...distances.map(x=>x[0]),"パター"];let cur=0;let logs=Array.from({length:18},()=>Array.from({length:5},()=>({club:""})));
const $=id=>document.getElementById(id);
function load(){try{const d=localStorage.getItem("sennanClubLogs");if(d){const saved=JSON.parse(d);logs=Array.from({length:18},(_,i)=>{const a=Array.isArray(saved[i])?saved[i]:[];return Array.from({length:Math.max(5,a.length)},(_,j)=>a[j]||{club:""})})}}catch(e){}}
function save(){try{localStorage.setItem("sennanClubLogs",JSON.stringify(logs))}catch(e){}}
function planText(h,i){
 const y=h[0],par=h[1];
 const fmt=n=>Math.max(0,Math.round(n));
 const clubY=Object.fromEntries(distances);
 const selectAtMost=(target, min=0)=>{
   // Choose the longest known club that does not exceed target; avoid recommending a putter off the green.
   const options=distances.filter(c=>c[1]<=target && c[1]>=min).sort((a,b)=>b[1]-a[1]);
   return options[0] || [...distances].sort((a,b)=>Math.abs(a[1]-target)-Math.abs(b[1]-target))[0];
 };
 const arr=[];
 if(par===3){
   // Pick closest club to the tee distance, but explicitly flag the 170/179/116 yard differences.
   const c=[...distances].sort((a,b)=>Math.abs(a[1]-y)-Math.abs(b[1]-y))[0];
   const diff=y-c[1];
   arr.push([`1打目｜${c[0]}・${c[1]}yd`, `白ティー表示 ${y}yd。登録飛距離との差は約${diff>=0?diff:0}yd。${diff>12?'このクラブでは届かない可能性があるため、風・打ち上げ・当日の距離を確認して1〜2番手上も検討。':'距離は目安。風・高低差・ライを見て番手を調整し、ピンよりグリーン中央を狙う。'}`]);
   arr.push(["外した場合｜ウェッジ", "実際のボール位置からグリーンまでの距離を測り、PW・48°・52°・56°から選ぶ。" ]);
   arr.push(["グリーン上｜パター", "グリーンに乗ったらパター。距離感を優先して3パットを避ける。"]);
   if(i===4) arr[0][1]+=" 5番はFront 170ydなので、登録距離だけでは届かない想定。無理せず手前からでも安全に。";
   if(i===16) arr[0][1]+=" 17番は池越え。公式案内は1クラブ大きめを推奨。池を越える番手が不確かな場合は安全優先。";
   if(i===13) arr[0][1]+=" 14番は打ち上げ・手前バンカーの案内あり。1クラブ大きめを検討し、手前バンカーに注意。";
   return arr;
 }
 // Do not assume a driver is always safe; it is the user's default tee club, with a course-safety caveat.
 const tee=Math.min(188,y);
 let rem=y-tee;
 arr.push([`1打目｜ドライバー・${tee}yd目安`, `白ティー ${y}yd。登録総距離188ydを基準にした単純計算で残り約${fmt(rem)}yd。公式案内・当日のハザードを確認し、狭い/危険なら安全なクラブに変更。`]);
 if(par===5){
   // Use a controlled layup when the remaining distance is long, aiming to leave ~80-100 yd where possible.
   let target=Math.max(0,rem-90);
   let c=selectAtMost(target, 55);
   if(rem<=100){ c=selectAtMost(rem); }
   let after=Math.max(0,rem-c[1]);
   arr.push([`2打目｜${c[0]}・${c[1]}yd目安`, `単純計算の残り約${fmt(rem)}yd。${rem>200?'無理な2オンは狙わず、次に打ちやすい場所へ刻む。':'残り距離とライを確認して前進。'} このクラブで打った場合の計算上の残りは約${fmt(after)}yd。`]);
   rem=after;
   if(rem>0){
     let c2=selectAtMost(rem);
     let after2=Math.max(0,rem-c2[1]);
     arr.push([`3打目｜${c2[0]}・${c2[1]}yd目安`, `計算上の残り約${fmt(rem)}yd。実際の残りとライを確認して選択。打った後の計算上の残りは約${fmt(after2)}yd。`]);
   }
   arr.push(["次打｜ウェッジ／パター", "実際の残り距離に合わせてウェッジでグリーンへ。グリーン上はパター。距離計算は目安で、実際のショット距離は毎回変わるよ。"]);
 }else{
   // For par 4, favor a layup to a known wedge yardage instead of blindly choosing the longest club.
   let c;
   if(rem>150) c=selectAtMost(rem-80, 55); // leave roughly 80 yd when possible
   else c=selectAtMost(rem);
   let after=Math.max(0,rem-c[1]);
   arr.push([`2打目｜${c[0]}・${c[1]}yd目安`, `ドライバー後の計算上の残り約${fmt(rem)}yd。${rem>150?'無理にグリーンを狙わず、得意なウェッジ距離を残す選択。':'残り距離に合わせてグリーンを狙う。'}このクラブで打った場合の計算上の残りは約${fmt(after)}yd。実際の残りとライを優先。`]);
   arr.push([`次打｜残り約${fmt(after)}yd（計算上）`, `実際の距離を測り、PW（100yd）・48°（80yd）・52°（65yd）・56°（55yd）から選ぶ。グリーン上はパター。`]);
 }
 if(i===0) arr[0][1]+=" 1番は公式案内でフェアウェイが広く、セカンドは打ち上げ。ティーショット後は打ち上げ分も考慮。";
 if(i===1) arr[0][1]+=" 2番は公式案内で右OBに注意。正面の目標よりやや左狙いとされるので、右へのミスを避ける。";
 if(i===8) arr[1][1]+=" 9番はセカンド地点の左右バンカーとグリーン左のOBに注意。";
 if(i===10) arr[0][1]+=" 11番はティーショット左右OBの案内あり。安全優先。";
 if(i===11) arr[0][1]+=" 12番は短いパー4だが、ワンオン狙いは前組の安全確認とハザード確認が必須。基本はフェアウェイキープ。";
 if(i===12) arr[0][1]+=" 13番は公式案内で右の山裾狙い、グリーン左奥のOBに注意。";
 if(i===15) arr[0][1]+=" 16番は左のレッドペナルティエリア・右OB。ティーショットは慎重に。";
 if(i===17) arr[0][1]+=" 18番は最後でも振り回さず、方向性優先。";
 return arr;
}
function score(i){return logs[i].filter(r=>r.club).length}
function scoreLabel(i){const diff=score(i)-holes[i][1];if(score(i)===0)return "—";if(diff===0)return "Par";if(diff<0)return (diff===-1?"Birdie":diff===-2?"Eagle":(diff)+"打");return "+"+diff}
function render(){let h=holes[cur];$("title").textContent=(cur+1)+"番ホール";$("par").textContent="Par "+h[1];$("yard").textContent=h[0]+"ヤード";$("lead").textContent=h[2];$("plan").innerHTML=planText(h,cur).map((x,i)=>`<div class="planrow"><div class="num">${i+1}</div><div><b>${x[0]}</b><p>${x[1]}</p></div></div>`).join("");$("holes").innerHTML=holes.map((x,i)=>`<button class="hole ${i===cur?'active':''} ${logs[i].some(r=>r.club)?'logged':''}" data-i="${i}"><span>${i+1}</span><small>${score(i)?score(i)+"打 · "+scoreLabel(i):"Par "+x[1]}</small></button>`).join("");document.querySelectorAll(".hole").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render()});renderRecords();renderReview()}
function renderRecords(){let arr=logs[cur];let content=arr.map((r,i)=>`<div class="record"><div class="recordhead"><b>${i+1}打目</b></div><div class="clubs">${names.map(n=>`<button class="club ${r.club===n?'selected':''}" data-shot="${i}" data-club="${n}">${n}</button>`).join("")}<button class="club" data-delete="${i}">この打を削除</button></div></div>`).join("");const addButton=score(cur)>=holes[cur][1]?`<button class="addshot" id="addshot">＋ 追加でクラブを選ぶ（${arr.length+1}打目）</button>`:"";$("records").innerHTML=content+addButton;document.querySelectorAll("[data-shot]").forEach(b=>b.onclick=()=>{let i=+b.dataset.shot;arr[i].club=b.dataset.club;save();render()});document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{arr.splice(+b.dataset.delete,1);if(arr.length<5)while(arr.length<5)arr.push({club:""});save();render()});const add=$("addshot");if(add)add.onclick=()=>{arr.push({club:""});save();render()}}
function renderReview(){let out='<tr><th>H</th><th>スコア</th><th>実際に使ったクラブ</th></tr>';holes.forEach((h,i)=>{let rows=logs[i];if(rows.some(r=>r.club))out+=`<tr><td>${i+1}（${h[0]}y）</td><td>${score(i)}（${scoreLabel(i)}）</td><td>${rows.filter(r=>r.club).map(r=>r.club).join(" / ")}</td></tr>`});$("review").innerHTML=out;$("feedback").textContent="各ホールで実際に使ったクラブを振り返れます。"}
$("prev").onclick=()=>{cur=Math.max(0,cur-1);render()};$("next").onclick=()=>{cur=Math.min(17,cur+1);render()};
$("export").onclick=()=>{let lines=["ゴルフクラブ記録"];holes.forEach((h,i)=>{if(logs[i].length){lines.push(`${i+1}番 Par${h[1]} ${h[0]}y`);logs[i].forEach((r,j)=>{if(r.club)lines.push(`${j+1}打目: ${r.club}`)})}});let text=lines.join("\n");if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>alert("記録をコピーしたよ。メモなどに貼り付けてね。")).catch(()=>prompt("この記録をコピーしてね",text));else prompt("この記録をコピーしてね",text)};
$("reset").onclick=()=>{if(confirm("全ホールのクラブ記録を削除しますか？")){logs=Array.from({length:18},()=>[]);save();render()}};
load();render();
</script></body></html>
